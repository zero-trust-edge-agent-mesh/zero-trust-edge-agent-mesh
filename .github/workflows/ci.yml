name: CI
on: [push, pull_request]
permissions: { contents: read }
jobs:
  test:
    strategy: { matrix: { os: [ubuntu-latest, windows-latest] } }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - run: python -m pip install "zero-trust-agent-benchmark @ git+https://github.com/zero-trust-agent-benchmark/zero-trust-agent-benchmark@v0.1.0"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check . && ruff format --check . && mypy src && pytest -q --cov=zero_trust_edge_agent_mesh --cov-fail-under=90
  spire-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q tests/test_integration_docker.py -m integration
        env:
          RUN_INTEGRATION_TESTS: '1'
