[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "zero-trust-edge-agent-mesh"
version = "0.1.0"
description = "Zero-trust SPIFFE edge mesh with signed CRDT policy replication"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Parag Sawant" }]
keywords = ["spiffe", "zero-trust", "edge", "crdt", "mtls", "ai-agents"]
classifiers = ["Programming Language :: Python :: 3.12", "Topic :: Security", "License :: OSI Approved :: Apache Software License"]
dependencies = ["cryptography>=50.0,<51"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "hypothesis>=6.112", "ruff>=0.8", "mypy>=1.13", "bandit>=1.7", "pip-audit>=2.7"]
bench = []

[project.scripts]
zero-trust-edge-agent-mesh-bench = "zero_trust_edge_agent_mesh.bench_cli:main"

[project.urls]
Homepage = "https://github.com/zero-trust-edge-agent-mesh/zero-trust-edge-agent-mesh"
Issues = "https://github.com/zero-trust-edge-agent-mesh/zero-trust-edge-agent-mesh/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/zero_trust_edge_agent_mesh"]

[tool.hatch.build.targets.wheel.force-include]
"src/zero_trust_edge_agent_mesh/default_profile.json" = "zero_trust_edge_agent_mesh/default_profile.json"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/zero_trust_edge_agent_mesh/stats.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "S603", "S607"]
"bench/**" = ["S101", "S311", "S607", "T201"]
"src/zero_trust_edge_agent_mesh/identity.py" = ["S106"]
"src/zero_trust_edge_agent_mesh/stats.py" = ["S311", "E231", "E501", "RUF022"]
"src/zero_trust_edge_agent_mesh/simulator.py" = ["S311"]
"src/zero_trust_edge_agent_mesh/trust.py" = ["E501", "UP042"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]
warn_unused_ignores = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: needs external services (set RUN_INTEGRATION_TESTS=1)"]

[tool.coverage.run]
branch = true
source = ["zero_trust_edge_agent_mesh"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]
